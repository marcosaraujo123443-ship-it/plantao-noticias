name: Publicar no Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Notícias", "Cotações da bolsa", "Contas dos estados", "Tabelas do futebol", "Cotações do agro", "Indicadores econômicos", "Tempo e concursos"]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: cloudflare
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verificar credenciais
        id: cred
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Secrets do Cloudflare ainda não configurados; nada a publicar."; echo "ok=0" >> "$GITHUB_OUTPUT"
          else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cred.outputs.ok == '1'
        with:
          ref: main
      - name: Montar a pasta do site
        if: steps.cred.outputs.ok == '1'
        run: |
          mkdir -p dist
          cp *.html *.json *.png *.jpg sw.js dist/ 2>/dev/null || true
          for f in ads.txt robots.txt sitemap.xml favicon.ico site.webmanifest sw.js; do [ -f $f ] && cp $f dist/ || true; done
          rm -f dist/telegram_enviados.json
          git fetch -q --depth 1 origin audio 2>/dev/null && git show FETCH_HEAD:plantao.mp3 > dist/plantao.mp3 || rm -f dist/plantao.mp3   # Ouça o Plantão
          python3 scripts/paginas.py dist
          ls dist
      - name: Publicar
        if: steps.cred.outputs.ok == '1'
        run: |
          npx --yes wrangler@3 pages project create plantaoinforma --production-branch main >/dev/null 2>&1 || true
          # Até 3 tentativas: falhas momentâneas do Cloudflare não devem derrubar a publicação
          for i in 1 2 3; do
            npx --yes wrangler@3 pages deploy dist --project-name plantaoinforma --branch main --commit-dirty=true && exit 0
            echo "::warning::Tentativa $i de publicar falhou; tentando de novo em 20 s"; sleep 20
          done
          exit 1
