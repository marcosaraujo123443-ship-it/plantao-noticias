name: Publicar no Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Notícias", "Cotações da bolsa", "Contas dos estados", "Tabelas do futebol", "Cotações do agro", "Indicadores econômicos", "Tempo e concursos", "Áudio do Plantão", "Histórico das contas"]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: cloudflare
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verificar credenciais
        id: cred
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Secrets do Cloudflare ainda não configurados; nada a publicar."; echo "ok=0" >> "$GITHUB_OUTPUT"
          else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cred.outputs.ok == '1'
        with:
          ref: main
      - name: Montar a pasta do site
        if: steps.cred.outputs.ok == '1'
        run: |
          mkdir -p dist
          cp *.html *.json *.png *.jpg sw.js dist/ 2>/dev/null || true
          cp 21339fef03e31e51ad22be47a0abe380.txt dist/   # chave do IndexNow
          curl -sf -m 30 https://plantaoinforma.com.br/sitemap.xml -o /tmp/sitemap_publicado.xml || true
          for f in ads.txt robots.txt sitemap.xml favicon.ico site.webmanifest sw.js podcast.xml; do [ -f $f ] && cp $f dist/ || true; done
          rm -f dist/telegram_enviados.json
          cp scripts/brasil_mapa.json dist/mapa_ufs.json && cp mapa-contas.js mapa-agro.js balancos.js contas-bim.js contas-mes.js forex.js dist/   # mapa das contas por estado
          cp scripts/brasil_meso.json dist/mapa_meso.json   # contornos das mesorregiões (mapa do tempo)
          git fetch -q --depth 1 origin audio 2>/dev/null && git show FETCH_HEAD:plantao.mp3 > dist/plantao.mp3 || rm -f dist/plantao.mp3   # Ouça o Plantão
          u=$(python3 -c "import json;print((json.load(open('express.json')).get('audio') or {}).get('url',''))" 2>/dev/null || true)   # Plantão Express no próprio site
          # o áudio do Express só é baixado do GitHub quando muda de edição (senão reaproveita o do site; não infla a contagem de downloads)
          ch=$(python3 -c "import json;print(json.load(open('express.json')).get('chave',''))" 2>/dev/null || true)
          if [ -n "$u" ]; then
            if [ "$(curl -sf -m 20 https://plantaoinforma.com.br/express.txt || true)" = "$ch" ] && curl -sf -m 60 https://plantaoinforma.com.br/express.mp3 -o dist/express.mp3; then :; else curl -sfL -m 60 "$u" -o dist/express.mp3 || rm -f dist/express.mp3; fi
            [ -f dist/express.mp3 ] && echo -n "$ch" > dist/express.txt
          fi
          python3 scripts/paginas.py dist
          ls dist
      - name: Publicar
        if: steps.cred.outputs.ok == '1'
        env:
          INDEXNOW_TUDO: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          npx --yes wrangler@3 pages project create plantaoinforma --production-branch main >/dev/null 2>&1 || true
          # Até 3 tentativas: falhas momentâneas do Cloudflare não devem derrubar a publicação
          for i in 1 2 3; do
            npx --yes wrangler@3 pages deploy dist --project-name plantaoinforma --branch main --commit-dirty=true && { python3 scripts/indexnow.py dist /tmp/sitemap_publicado.xml || true; exit 0; }
            echo "::warning::Tentativa $i de publicar falhou; tentando de novo em 20 s"; sleep 20
          done
          exit 1
