name: Notícias
on:
  schedule:
    # de hora em hora das 7h às 23h de Brasília, mais 01h e 04h (horários em UTC)
    - cron: "5 0-2,4,7,10-23 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/noticias.py", "scripts/gerar.py", "scripts/modelo.html", ".github/workflows/noticias.yml"]
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler feeds
        run: python3 scripts/noticias.py
      - name: Gerar a página
        run: python3 scripts/gerar.py . mercado.json index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json index.html
          git diff --cached --quiet && exit 0
          git commit -m "Notícias $(TZ=America/Sao_Paulo date +%d/%m\ %H:%M)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
