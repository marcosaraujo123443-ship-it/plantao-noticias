name: Notícias
on:
  schedule:
    # de hora em hora das 7h às 23h de Brasília, mais 01h e 04h (horários em UTC)
    - cron: "5 0-2,4,7,10-23 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [noticias]   # disparado pelo agendador (agendador/worker.js)
  push:
    paths: ["scripts/og.py", "scripts/resumo.py", "scripts/telegram.py", "scripts/noticias.py", "scripts/gerar.py", "scripts/modelo.html", "scripts/agenda.py", "scripts/audio.py", "scripts/ia_lancamentos.py", "scripts/brasil_mapa.json", "scripts/materias.py", "materias/**", ".github/workflows/noticias.yml"]
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ler feeds
        run: python3 scripts/noticias.py
      - name: Resumo do Plantão (IA grátis do Gemini)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESUMO_FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 scripts/resumo.py
      - name: Lançamentos de IA da semana
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/ia_lancamentos.py
      - name: Ouça o Plantão (voz do resumo)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet imageio-ffmpeg
          python3 scripts/audio.py
          bash scripts/publicar_audio.sh
      - name: O que acompanhar hoje (agenda)
        continue-on-error: true
        run: python3 scripts/agenda.py
      - name: Imagem de compartilhamento
        continue-on-error: true
        run: pip install --quiet pillow && python3 scripts/og.py
      - name: Gerar a página
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python3 scripts/gerar.py . mercado.json index.html
      - name: Enviar ao Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 scripts/telegram.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json index.html telegram_enviados.json resumo.json og.png agenda.json $( [ -f audio.json ] && echo audio.json ) $( [ -f ia_lancamentos.json ] && echo ia_lancamentos.json ) $( [ -f podcast.json ] && echo podcast.json podcast.xml ) 2>/dev/null || git add noticias.json index.html telegram_enviados.json
          git diff --cached --quiet && exit 0
          git commit -m "Notícias $(TZ=America/Sao_Paulo date +%d/%m\ %H:%M)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
