name: Verificar domínios (temporário)
on:
  push:
    paths: [".github/workflows/dominios.yml"]
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in plantaonoticias.com.br plantaodenoticias.com.br plantaonoticias.news plantaodenoticias.news plantaonoticias.com plantaodenoticias.com portalplantao.com.br plantaobrasil.com.br; do
            case $d in
              *.br) u="https://rdap.registro.br/domain/$d";;
              *.com) u="https://rdap.verisign.com/com/v1/domain/$d";;
              *) u="https://rdap.org/domain/$d";;
            esac
            c=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$u")
            echo "RESULTADO $d http=$c"
          done
