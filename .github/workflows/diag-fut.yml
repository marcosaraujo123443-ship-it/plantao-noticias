name: diag-teste
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPRESS_FORCAR: "1"
          EXPRESS_TESTE: "1"
          EXPLICA_FORCAR: "1"
        run: |
          pip install --quiet imageio-ffmpeg
          mkdir -p /tmp/out
          python3 scripts/express.py 2>&1 | tee /tmp/out/express.log || true
          cp express.json express-*.mp3 /tmp/out/ 2>/dev/null || true
          python3 scripts/explicador.py 2>&1 | tee /tmp/out/explica.log || true
          cp -r explica /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b diag-dados && git add . && git -c user.name=diag -c user.email=diag@x commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-dados
