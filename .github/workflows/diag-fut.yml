name: diag-podcast
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/out; cd /tmp/out
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" https://open.spotify.com/embed/show/5td62B4h3rU8rFQnyomgti -o embed.html
          git init -q && git checkout -q -b diag-dados && git add . && git -c user.name=diag -c user.email=diag@x commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-dados
