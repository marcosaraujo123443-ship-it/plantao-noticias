name: diag-feeds
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir /tmp/out; i=0
          while read u; do i=$((i+1)); curl -sL -m 30 -A "Mozilla/5.0 (compatible; PlantaoNoticias/1.0)" "$u" -o /tmp/out/feed$i.xml; echo "$i $u" >> /tmp/out/index.txt; done < .github/diag-urls.txt
          python3 - <<'PY'
          import json,re,urllib.request
          d=json.load(open('noticias.json'))
          seen=set();out={}
          for it in d['itens']:
              if it['fonte'] in seen: continue
              seen.add(it['fonte'])
              try:
                  h=urllib.request.urlopen(urllib.request.Request(it['link'],headers={"User-Agent":"Mozilla/5.0 (compatible; PlantaoNoticias/1.0)"}),timeout=20).read(300000).decode('utf-8','ignore')
                  m=re.search(r'<meta[^>]+property=["\']og:image["\'][^>]*>',h); out[it['fonte']]=m.group(0) if m else 'SEM'
              except Exception as e: out[it['fonte']]=repr(e)
          json.dump(out,open('/tmp/out/og.json','w'),ensure_ascii=False,indent=1)
          PY
          cd /tmp/out && git init -q && git checkout -q -b diag-dados && git add . && git -c user.name=diag -c user.email=diag@x commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-dados
