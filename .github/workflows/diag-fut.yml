name: diag-acessos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IG: ${{ secrets.IG_TOKEN }}
          GH: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/out && python3 .github/diag_acessos.py
          cd /tmp/out && git init -q && git checkout -q -b diag-dados && git add . && git -c user.name=diag -c user.email=diag@x commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-dados
