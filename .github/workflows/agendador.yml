name: Publicar o agendador (Cloudflare Worker)
on:
  workflow_dispatch:
  push:
    paths: ["agendador/**", ".github/workflows/agendador.yml"]
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Publicar o Worker e o secret
        working-directory: agendador
        run: |
          npx --yes wrangler@3 deploy
          printf '%s' "${{ secrets.GH_PAT }}" | npx --yes wrangler@3 secret put GH_PAT
