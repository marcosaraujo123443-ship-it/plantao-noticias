name: Cotações da bolsa
on:
  schedule:
    - cron: "*/15 12-21 * * 1-5"   # a cada 15 min no pregão (9h-18h de Brasília)
    - cron: "17 */3 * * *"          # moedas e bitcoin fora do pregão
  workflow_dispatch:
  push:
    paths: ["scripts/mercado.py", ".github/workflows/mercado.yml"]
permissions:
  contents: write
concurrency:
  group: mercado
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coletar cotações
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python3 scripts/mercado.py
      - name: Publicar mercado.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mercado.json
          git diff --cached --quiet && exit 0
          git commit -m "Cotações $(date -u +%H:%M) UTC"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
