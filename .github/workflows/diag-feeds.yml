name: diag-feeds
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          for u in \
            https://canaltech.com.br/rss/ \
            https://canaltech.com.br/rss/ciencia/ \
            https://canaltech.com.br/rss/saude/ \
            https://olhardigital.com.br/editorias/ciencia-e-espaco/feed/ \
            https://olhardigital.com.br/editorias/ciencia/feed/ \
            https://olhardigital.com.br/feed/ \
            https://agenciabrasil.ebc.com.br/rss/saude/feed.xml \
            https://agenciabrasil.ebc.com.br/rss/geral/feed.xml \
            https://portal.fiocruz.br/rss.xml \
            https://agencia.fiocruz.br/rss.xml \
            https://fiocruz.br/rss.xml \
            https://www.gov.br/saude/pt-br/assuntos/noticias/RSS \
            https://www.gov.br/anvisa/pt-br/assuntos/noticias-anvisa/RSS \
            "https://api.open-meteo.com/v1/forecast?latitude=-15.78,-23.55&longitude=-47.93,-46.63&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&current=temperature_2m,weather_code&timezone=America/Sao_Paulo&forecast_days=4" \
            https://apiprevmet3.inmet.gov.br/avisos/ativos \
            https://apiprevmet3.inmet.gov.br/previsao/5300108 \
            "https://alertas2.inmet.gov.br/" \
            "https://servicodados.ibge.gov.br/api/v3/malhas/paises/BR?formato=application/vnd.geo+json&intrarregiao=UF&qualidade=minima" \
            ; do
            r=$(curl -s -L -m 25 -A "$UA" -o /tmp/b -w "%{http_code} %{content_type}" "$u" || true); n=$(grep -o "<item" /tmp/b | wc -l)
            echo "$r items=$n size=$(wc -c </tmp/b) $u :: $(head -c 300 /tmp/b | tr -d '\n\r' | tr -c '[:print:]' ' ' | cut -c1-120)" >> /tmp/out
          done
          split -l 4 /tmp/out /tmp/parte; for f in /tmp/parte*; do echo "::notice::$(sed ':a;N;$!ba;s/\n/%0A/g' $f)"; done
