name: diag-feeds
on: workflow_dispatch
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IA_FORCAR: "1"
        run: |
          git push -q origin --delete diag-dados || true
          python3 scripts/ia_lancamentos.py || true
          [ -f ia_lancamentos.json ] && echo "::notice::$(tr -d '\n' < ia_lancamentos.json | cut -c1-900)"
