name: diag-feeds
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/diag_probe.py || true
          split -l 9 /tmp/out /tmp/parte; for f in /tmp/parte*; do echo "::notice::$(sed ':a;N;$!ba;s/\n/%0A/g' $f)"; done
