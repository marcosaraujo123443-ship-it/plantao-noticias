name: Explica Plantão
# Um guia de perguntas e respostas por dia útil sobre leis, tributos e direitos (scripts/explicador.py)
on:
  schedule:
    - cron: "17 14 * * 1-5"   # 11h17 de Brasília
    - cron: "47 17 * * 1-5"   # 14h47: nova tentativa se a primeira não achou nada
  workflow_dispatch:
    inputs:
      refazer:
        description: "Reescrever os guias no formato antigo (1) ou todos (todos)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: explica
  cancel-in-progress: false
jobs:
  guia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Escrever o guia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPLICA_FORCAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          EXPLICA_REFAZER: ${{ github.event.inputs.refazer }}
        run: python3 scripts/explicador.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explica explica_registro.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Explica Plantão $(TZ=America/Sao_Paulo date +%d/%m)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
