name: Testar IA (temporário)
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== catálogo"; curl -sS -i https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" | head -c 1500; echo
          for m in openai/gpt-4.1-mini openai/gpt-4o-mini openai/gpt-5-mini; do
            echo "== $m"
            curl -sS -i https://models.github.ai/inference/chat/completions \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Diga oi em uma palavra\"}]}" | head -c 1500; echo
          done
          echo "== org endpoint"
          curl -sS -i https://models.github.ai/orgs/${{ github.repository_owner }}/inference/chat/completions \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
              -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"oi"}]}' | head -c 800; echo
