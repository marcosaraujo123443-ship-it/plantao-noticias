name: Áudio do Plantão
# Gera de novo a narração do resumo atual (sem refazer o resumo nem mandar ao Telegram)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Narrar o resumo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIO_FORCAR: "1"
        run: |
          pip install --quiet imageio-ffmpeg
          python3 scripts/audio.py
          d=$(mktemp -d); mv plantao.mp3 "$d/"
          (cd "$d" && git init -q -b audio && git add plantao.mp3 \
            && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Ouça o Plantão" \
            && git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" audio)
          python3 scripts/gerar.py . mercado.json index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio.json index.html
          git diff --cached --quiet && exit 0
          git commit -m "Áudio do Plantão $(TZ=America/Sao_Paulo date +%d/%m\ %H:%M)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
