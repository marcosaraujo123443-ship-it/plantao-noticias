name: Diagnóstico agenda e voz (temporário)
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for d in 2026-10-28 2026-10-29; do
            AGENDA_DATA=$d python3 scripts/agenda.py
            python3 -c "
          import json;a=json.load(open('agenda.json'))
          for i in a['itens']: print('::notice::'+a['data']+' '+json.dumps(i,ensure_ascii=False)[:600])
          print('::notice::erros',a['erros'])"
          done
