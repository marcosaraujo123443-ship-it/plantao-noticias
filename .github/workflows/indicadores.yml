name: Indicadores econômicos
on:
  schedule:
    - cron: "5 12 * * *"    # 9h05 de Brasília (IBGE e FGV divulgam pela manhã)
    - cron: "45 23 * * *"   # 20h45 (decisão do Copom sai por volta das 18h30)
  workflow_dispatch:
  push:
    paths: ["scripts/indicadores.py", ".github/workflows/indicadores.yml"]
permissions:
  contents: write
concurrency:
  group: indicadores
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coletar no Banco Central
        run: python3 scripts/indicadores.py
      - name: Publicar indicadores.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicadores.json
          git diff --cached --quiet && exit 0
          git commit -m "Indicadores $(TZ=America/Sao_Paulo date +%d/%m\ %H:%M)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
