name: Indicadores econômicos
on:
  schedule:
    - cron: "5 12 * * *"    # 9h05 de Brasília (IBGE e FGV divulgam pela manhã)
    - cron: "45 23 * * *"   # 20h45 (decisão do Copom sai por volta das 18h30)
    - cron: "25 14 * * *"   # 11h25 (payroll às 10h30; IBGE e BC já atualizados)
    - cron: "25 18 * * *"   # 15h25 (Fed e BCE: taxa nova no dia seguinte à decisão)
  workflow_dispatch:
  push:
    paths: ["scripts/indicadores.py", "scripts/economias.py", "scripts/balancos.py", "scripts/indicadores2.py", "scripts/contas_mensal.py", ".github/workflows/indicadores.yml"]
permissions:
  contents: write
concurrency:
  group: indicadores
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coletar no Banco Central
        run: python3 scripts/indicadores.py
      - name: 20 maiores economias (Banco Mundial)
        continue-on-error: true
        run: python3 scripts/economias.py
      - name: Indicadores adicionais (Caged, Focus, IBGE, Fed, BCE, payroll...)
        continue-on-error: true
        run: python3 scripts/indicadores2.py
      - name: Contas públicas mês a mês (Banco Central)
        continue-on-error: true
        run: python3 scripts/contas_mensal.py
      - name: Balanços das empresas (CVM)
        continue-on-error: true
        run: python3 scripts/balancos.py
      - name: Publicar indicadores.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicadores.json $( [ -f economias.json ] && echo economias.json ) $( [ -f balancos.json ] && echo balancos.json ) $( [ -f indicadores2.json ] && echo indicadores2.json ) $( [ -f contas_mensal.json ] && echo contas_mensal.json )
          git diff --cached --quiet && exit 0
          git commit -m "Indicadores $(TZ=America/Sao_Paulo date +%d/%m\ %H:%M)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
