name: Verificar domínio (temporário)
on: workflow_dispatch
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in "" contas/ contas/sp contas/sp.html tabelas/ tabelas/brasileirao-serie-a agro acoes fiis sitemap.xml robots.txt; do
            u="https://plantaoinforma.com.br/$p"
            curl -sS -o /tmp/p -w "%{http_code} $u -> %{url_effective}\n" -L --max-time 20 "$u" || true
            grep -o "<title>[^<]*" /tmp/p | head -1 || true
          done
          curl -sS https://plantaoinforma.com.br/sitemap.xml | grep -c "<loc>"
