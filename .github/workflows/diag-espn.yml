name: Diagnóstico ESPN (temporário)
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30) as r: return json.load(r)
          for cod in ("bra.1", "eng.1", "uefa.champions"):
              d = get(f"https://site.api.espn.com/apis/site/v2/sports/soccer/{cod}/scoreboard?dates=202610&lang=pt&region=br")
              ev = d["events"][0]; comp = ev["competitions"][0]
              print(f"::notice::{cod} ev keys: {sorted(ev.keys())} | week={ev.get('week')} | season={ev.get('season')}")
              print(f"::notice::{cod} comp keys: {sorted(comp.keys())} | notes={comp.get('notes')} | type={comp.get('type')} | series={str(comp.get('series'))[:150]}")
              lg = d.get("leagues", [{}])[0]
              cal = lg.get("calendar") or []
              print(f"::notice::{cod} league keys {sorted(lg.keys())} calendarType={lg.get('calendarType')} cal0={str(cal[:2])[:400]}")
              try:
                  s = get(f"https://site.api.espn.com/apis/site/v2/sports/soccer/{cod}/summary?event={ev['id']}")
                  hdr = s.get("header", {}); c = (hdr.get("competitions") or [{}])[0]
                  print(f"::notice::{cod} summary header keys {sorted(hdr.keys())} week={hdr.get('week')} gameNote={hdr.get('gameNote')} comp notes={c.get('notes')}")
              except Exception as e: print(f"::error::summary {cod}: {e}")
          PY
