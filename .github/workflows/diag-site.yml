name: Diagnóstico site (temporário)
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "" sobre privacidade tabelas/la-liga contas/sp indicadores; do
            c=$(curl -sSL "https://plantaoinforma.com.br/$u?nc=$RANDOM")
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://plantaoinforma.com.br/$u")
            echo "::notice::/$u [$code] canonica: $(echo "$c" | grep -o 'rel="canonical" href="[^"]*"' | head -1) | links internos .html: $(echo "$c" | grep -oE 'href="[^"]*\.html[^"]*"' | grep -vc 'https\?:')"
          done
          echo "::notice::/sobre.html -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://plantaoinforma.com.br/sobre.html)"
