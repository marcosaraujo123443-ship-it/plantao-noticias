name: Diagnóstico site (temporário)
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - run: |
          c=$(curl -sSL "https://plantaoinforma.com.br/?nc=$RANDOM")
          echo "::notice::busca: $(echo "$c" | grep -c 'data-q') foco: $(echo "$c" | grep -c 'data-foco') calc: $(echo "$c" | grep -c 'data-calc') tendencia: $(echo "$c" | grep -c 'data-ag=\"ten\"') ld+json: $(echo "$c" | grep -c 'application/ld+json') og: $(echo "$c" | grep -o 'og:image" content="[^"]*"')"
          for f in og.png agro_historico.json noticias.json indicadores.json; do echo "::notice::$f $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' https://plantaoinforma.com.br/$f)"; done
