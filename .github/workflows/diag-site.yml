name: diag-site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d && cd d
          g(){ curl -s -m 60 -A "Mozilla/5.0" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> log.txt || echo "$1 falhou" >> log.txt; }
          g pib3.json "https://apisidra.ibge.gov.br/values/t/5938/n3/all/v/37,513/p/last%203"
          g pam_prod.json "https://apisidra.ibge.gov.br/values/t/5457/n1/all/v/214/p/last%201/c782/all"
          g lspa_prod.json "https://apisidra.ibge.gov.br/values/t/6588/n1/all/v/35/p/last%201/c48/all"
          g wb_paises.json "https://api.worldbank.org/v2/country?format=json&per_page=400"
          cat log.txt
          git init -q -b diag-dados && git add . && git -c user.name=bot -c user.email=b@b commit -qm d && git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag-dados
