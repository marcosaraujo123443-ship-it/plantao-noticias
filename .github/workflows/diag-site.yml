name: diag-site
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          h=$(curl -s https://plantaoinforma.com.br/)
          echo "::notice::agenda=$(echo "$h" | grep -c 'class="agenda"') ouca=$(echo "$h" | grep -o 'plantao.mp3?v=[^"]*' | head -1)"
          echo "::notice::mp3 $(curl -sI "https://plantaoinforma.com.br/plantao.mp3" | grep -iE '^(HTTP|content-type|content-length)' | tr '\r\n' '  ')"
