name: diag-site
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.cepea.org.br/br/widgetproduto.js.php?fonte=arial&tamanho=10&largura=400px&corfundo=dbd6b2&cortexto=333333&corlinha=ede7bf&id_indicador%5B%5D=92&id_indicador%5B%5D=2&id_indicador%5B%5D=77" "https://cepea.org.br/br/indicador/boi-gordo.aspx" "https://www.cepea.esalq.usp.br/br/indicador/soja.aspx" "https://portaldeinformacoes.conab.gov.br/index.php/precos-agropecuarios"; do
            c=$(curl -sL -o b.html -w "%{http_code}" -A "Mozilla/5.0 (X11; Linux x86_64) Chrome/130.0 Safari/537.36" "$u")
            echo "::notice::$c $(wc -c < b.html) $(head -c 300 b.html | tr '\n<>' '   ' | cut -c1-250) || $u"
          done
