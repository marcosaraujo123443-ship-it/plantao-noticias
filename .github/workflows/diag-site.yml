name: diag-site
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.FB_PAGE_TOKEN }}
          P: ${{ secrets.FB_PAGE_ID }}
        run: |
          r=$(curl -s "https://graph.facebook.com/v23.0/$(echo $P|tr -d ' ')?fields=name,link,username&access_token=$(echo $T|tr -d ' \"')")
          echo "::notice::$(echo "$r" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("name"),d.get("link"),d.get("username"),d.get("error",{}).get("message",""))')"
