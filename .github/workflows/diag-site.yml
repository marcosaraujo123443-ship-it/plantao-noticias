name: diag-site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d && cd d
          g(){ curl -s -m 60 -A "Mozilla/5.0" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> log.txt || echo "$1 falhou" >> log.txt; }
          g pib_all.json "https://apisidra.ibge.gov.br/values/t/5938/n3/51/v/all/p/last%203"
          g pib_br.json "https://apisidra.ibge.gov.br/values/t/5938/n1/all/v/all/p/last%203"
          g ppm_all.json "https://apisidra.ibge.gov.br/values/t/3939/n1/all/v/all/p/last%201/c79/all"
          g wb_paises.json "https://api.worldbank.org/v2/country?format=json&per_page=400"
          cat log.txt
          git init -q -b diag-dados && git add . && git -c user.name=bot -c user.email=b@b commit -qm d && git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag-dados
