name: diag-site
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          c=$(curl -s -o r.txt -w "%{http_code}" -X POST -H "Authorization: Bearer ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/dispatches -d '{"event_type":"teste"}')
          echo "::notice::dispatch $c $(head -c 200 r.txt | tr '\n' ' ')"
          echo "::notice::scopes $(curl -sI -H "Authorization: Bearer ${{ secrets.GH_PAT }}" https://api.github.com/user | grep -i 'x-oauth-scopes\|github-authentication-token-expiration' | tr '\r\n' '  ')"
