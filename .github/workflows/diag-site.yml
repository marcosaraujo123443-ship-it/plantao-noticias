name: diag-site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d; cd d
          for p in soja milho boi-gordo bezerro cafe trigo algodao acucar etanol arroz frango suino laranja; do
            curl -sL -m 60 -o $p.html -w "$p %{http_code} %{size_download}\n" -A "Mozilla/5.0 (X11; Linux x86_64) Chrome/130.0 Safari/537.36" "https://cepea.org.br/br/indicador/$p.aspx" >> log.txt; sleep 2; done
          git init -q -b diag-dados && git add . && git -c user.name=bot -c user.email=b@b commit -qm d && git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diag-dados
