name: diag-site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git push -q origin --delete diag-dados || true
          h=$(curl -s https://plantaoinforma.com.br/)
          echo "::notice::abas=$(echo "$h" | grep -o 'data-tab="[a-z-]*" aria-pressed' | tr '\n' ' ') mapa=$(echo "$h" | grep -c 'tp-uf')"
          for f in tempo.json concursos.json; do echo "::notice::$f $(curl -sI https://plantaoinforma.com.br/$f | grep -iE '^(HTTP|content-length)' | tr '\r\n' '  ')"; done
