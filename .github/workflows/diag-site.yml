name: diag-site
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://www.noticiasagricolas.com.br/cotacoes/soja
          for ua in "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" "curl/8.5.0"; do
            c=$(curl -s -o b.html -D h.txt -w "%{http_code}" -A "$ua" -H "Accept: text/html,application/xhtml+xml" -H "Accept-Language: pt-BR,pt;q=0.9" "$U")
            echo "::notice::$c server=$(grep -i '^server:' h.txt | tr -d '\r') cf=$(grep -ic 'cf-mitigated\|challenge' h.txt b.html | tr '\n' ' ') title=$(grep -o '<title>[^<]*' b.html | head -1)"
          done
          c=$(curl -s -o b2.html -w "%{http_code}" "https://www.cepea.org.br/br/indicador/soja.aspx" -A "Mozilla/5.0 Chrome/130"); echo "::notice::cepea $c $(grep -o '<title>[^<]*' b2.html | head -1)"
